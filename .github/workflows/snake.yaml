name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Chibie345
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix Grid and Snake Position
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          for file in files:
              if not file.exists():
                  raise SystemExit(f"File SVG tidak ditemukan: {file}")

              svg = file.read_text()

              # Tambahkan kotak yang hilang hanya jika koordinat
              # kolom paling kanan memang menggunakan x=834.
              marker = '<rect class="c c1" x="834" y="18" rx="2" ry="2"/>'
              extra = ''.join(
                  f'<rect class="c" x="834" y="{y}" rx="2" ry="2"/>'
                  for y in [34, 50, 66, 82, 98]
              )

              if marker in svg:
                  for y in [34, 50, 66, 82, 98]:
                      pattern = (
                          rf'<rect class="c(?: c\d+)?" '
                          rf'x="834" y="{y}" rx="2" ry="2"/>'
                      )
                      svg = re.sub(pattern, '', svg)

                  svg = svg.replace(marker, marker + extra, 1)

              file.write_text(svg)
              print(f"SVG diproses: {file}")

          PY

      - name: Deploy Snake to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution snake"
