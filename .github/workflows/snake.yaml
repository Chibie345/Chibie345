
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Chibie345
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add missing grid squares
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          marker = '<rect class="c c1" x="834" y="18" rx="2" ry="2"/>'

          for file in files:
              if not file.exists():
                  continue

              svg = file.read_text()

              if marker in svg and 'x="834" y="34"' not in svg:
                  extra = ''.join(
                      f'<rect class="c" x="834" y="{y}" rx="2" ry="2"/>'
                      for y in [34, 50, 66, 82, 98]
                  )
                  svg = svg.replace(marker, marker + extra, 1)
                  file.write_text(svg)

      - name: Deploy Snake to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution snake"
