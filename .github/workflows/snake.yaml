
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Chibie345
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Missing Rightmost Grid Cells
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          for file in files:
              if not file.exists():
                  continue

              svg = file.read_text()

              for y in [66, 82, 98]:
                  pattern = (
                      rf'<rect class="c(?: c\d)?" '
                      rf'x="834" y="{y}"'
                  )

                  if not re.search(pattern, svg):
                      cell = (
                          f'<rect class="c" x="834" y="{y}" '
                          'rx="2" ry="2"/>'
                      )
                      svg = svg.replace("</svg>", cell + "</svg>", 1)

              file.write_text(svg)
              print(f"Grid diperiksa: {file}")

          PY

      - name: Deploy Snake to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution snake"
